name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      break_health:
        description: "Simulate a bad release (health check fails) to test rollback"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ecs-bluegreen
  ECS_CLUSTER: ecs-bluegreen-cluster
  ECS_SERVICE: ecs-bluegreen-svc
  ECS_TASK_FAMILY: ecs-bluegreen
  CONTAINER_NAME: app
  CODEDEPLOY_APP: ecs-bluegreen
  CODEDEPLOY_GROUP: ecs-bluegreen-dg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt bandit pip-audit

      - name: Unit tests
        run: pytest -v

      - name: Code security scan (Bandit)
        run: bandit -r app -ll

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t app:${IMAGE_TAG} .

      - name: Scan image with Trivy (fail on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: app:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Everything below runs only on the main branch
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag app:${IMAGE_TAG} $REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          docker push $REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Fetch current task definition
        if: github.ref == 'refs/heads/main'
        run: aws ecs describe-task-definition --task-definition $ECS_TASK_FAMILY --query taskDefinition > task-definition.json

      - name: Render new task definition
        if: github.ref == 'refs/heads/main'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}
          environment-variables: |
            APP_VERSION=${{ env.IMAGE_TAG }}
            BREAK_HEALTH=${{ inputs.break_health || 'false' }}

      - name: Deploy with CodeDeploy (blue-green)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          codedeploy-appspec: appspec.yaml
          codedeploy-application: ${{ env.CODEDEPLOY_APP }}
          codedeploy-deployment-group: ${{ env.CODEDEPLOY_GROUP }}
          wait-for-service-stability: true